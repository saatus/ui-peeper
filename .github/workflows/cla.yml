name: CLA Assistant

# CLA Assistant Lite runs entirely inside this repository: it comments on pull
# requests from contributors who have not signed, and commits their signature to
# signatures/version1/cla.json when they reply with the sign-off phrase.
#
# Chosen over the hosted cla-assistant.io app on purpose — no third-party service
# needs installing, and no contributor data leaves this repository.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# GITHUB_TOKEN is read-only by default in many repositories; the action needs to
# write the signature file and set the PR status, so state it explicitly.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    steps:
      # SECURITY: this job runs on `pull_request_target`, which means it executes
      # with write permissions and repository secrets in the context of the BASE
      # repo. That is required for the action to comment and commit, and it is
      # only safe because nothing here checks out or runs the pull request's code.
      # Never add an actions/checkout of the PR head to this workflow, and never
      # add a build or test step — put those in a `pull_request` workflow instead.
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # Pinned to the commit SHA of v2.6.1, not the tag: a tag can be moved to
        # point at different code, a commit SHA cannot.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://github.com/saatus/ui-peeper/blob/main/CLA.md'
          path-to-signatures: 'signatures/version1/cla.json'
          # Signatures are committed here, so this branch must NOT be protected
          # in repository settings or every signature will fail to save.
          branch: 'main'
          # The repository owner does not sign their own agreement; bots cannot.
          allowlist: 'saatus,dependabot[bot],renovate[bot],github-actions[bot]'
          custom-notsigned-prcomment: >-
            Thanks for the pull request — this is genuinely appreciated.


            Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/saatus/ui-peeper/blob/main/CLA.md)
            and sign it by posting exactly the comment below. It confirms you wrote the
            contribution and lets the project relicense in future without having to track
            down every past contributor individually.
          custom-allsigned-prcomment: >-
            All contributors have signed the CLA. Thanks — over to review.
